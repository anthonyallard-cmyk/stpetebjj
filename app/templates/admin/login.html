<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Login — St. Pete Brazilian Jiu-Jitsu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#09090B] text-white min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md rounded-3xl bg-[#131317] border border-white/10 p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <img src="/static/images/logo-circle.png" alt="St. Pete BJJ" class="w-20 h-20 mx-auto rounded-full border border-[#CE1E36]">
            <h1 class="font-bold text-2xl">St. Pete BJJ Admin Console</h1>
            <p class="text-xs text-zinc-400">Protected Academy Management Portal</p>
        </div>

        {% if error %}
        <div class="p-3.5 rounded-xl bg-red-950/90 border border-red-500/40 text-red-200 text-xs font-medium text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="{{ admin_path }}/login" method="post" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Username</label>
                <input type="text" name="username" required value="admin" class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/15 text-sm text-white focus:border-[#CE1E36] focus:outline-none">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••••••" class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-white/15 text-sm text-white focus:border-[#CE1E36] focus:outline-none">
            </div>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-[#CE1E36] hover:bg-[#b0162b] font-bold text-sm uppercase tracking-wider transition">
                Sign In to Admin Console
            </button>
        </form>
        <div class="text-center">
            <a href="/" class="text-xs text-zinc-500 hover:text-white">&larr; Return to Public Website</a>
        </div>
    </div>
</body>
</html>
