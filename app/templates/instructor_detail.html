{% extends "base.html" %}

{% block content %}
<section class="py-16 bg-[#09090B] border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-6">
            <a href="/st-pete-jiu-jitsu-professors" class="text-xs font-mono-tech text-zinc-400 hover:text-white inline-flex items-center gap-1.5">
                <span>&larr; Back to All St. Pete BJJ Professors &amp; Instructors</span>
            </a>
        </div>

        <div class="bezel-card">
            <div class="bezel-card-inner p-6 sm:p-12">
                <div class="grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
                    <div class="lg:col-span-4">
                        <div class="rounded-2xl overflow-hidden border border-white/15 bg-zinc-900 shadow-2xl">
                            <img src="{{ instructor.image }}" alt="{{ instructor.name }}" class="w-full h-auto object-cover">
                        </div>
                    </div>
                    <div class="lg:col-span-8 space-y-5">
                        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#CE1E36]/20 border border-[#CE1E36]/40 text-xs font-mono-tech font-bold text-[#FF4D64]">
                            {{ instructor.rank }}
                        </div>
                        <h1 class="font-display font-black text-3xl sm:text-5xl text-white tracking-tight">{{ instructor.name }}</h1>
                        <div class="text-base font-semibold text-zinc-300">{{ instructor.role }} • {{ instructor.lineage }}</div>
                        <div class="prose prose-invert max-w-none space-y-4 text-zinc-200 text-base sm:text-lg leading-relaxed pt-2">
                            {{ instructor.bio | safe }}
                        </div>
                        <div class="pt-4 flex flex-wrap gap-4">
                            <a href="/contact#free-trial" class="btn-crimson px-6 py-3.5 rounded-xl font-display font-bold text-xs uppercase tracking-wider">
                                Book Free Intro Class
                            </a>
                            <a href="/brazilian-jiu-jitsu-class-schedule-saint-petersburg-florida-2" class="px-5 py-3.5 rounded-xl bg-zinc-900 border border-white/15 text-xs font-display font-bold uppercase tracking-wider text-white hover:border-[#CE1E36] transition">
                                View Class Schedule
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
