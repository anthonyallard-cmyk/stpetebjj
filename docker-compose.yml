# Local & Production Docker Stack for St. Pete Brazilian Jiu-Jitsu (stpetebjj.com)
# Local URL: http://www.stpetebrazilianjiujitsu.test:48828
# Bound to 127.0.0.1:48828 to avoid colliding with any other containers.

services:
  web:
    build: .
    container_name: spb-py-web
    restart: unless-stopped
    environment:
      SITE_NAME: "St. Pete Brazilian Jiu-Jitsu"
      DOMAIN: "www.stpetebjj.com"
      LOCAL_DOMAIN: "www.stpetebrazilianjiujitsu.test"
      BASE_URL: "https://www.stpetebjj.com"
      ADMIN_PATH: "/admin-25263863535"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./static:/app/static
      - ./app:/app/app
    ports:
      - "127.0.0.1:48828:8000"
